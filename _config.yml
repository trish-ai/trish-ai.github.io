# Site settings
title:          "Trish's Blog"
description:    "ML research to production notes, projects, and paper takeaways."
# For a GitHub Pages *user site* (https://trish-ai.github.io), baseurl must be empty.
baseurl:        ""
url:            "https://trish-ai.github.io"

# Google Analytics
# Set your GA tracking id (or leave blank to disable)
google_analytics: G-6TTP3823TB

# Author
author:
  name:         Trishala Neeraj
  url:          https://github.com/trish-ai
  email:

# Build settings
markdown:       kramdown
include:
  - _pages

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  # - jemoji #Uncomment this to allow emoji in your post

# Permalinks
permalink:      /:year-:month-:day/:title
paginate:       5

# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec ]

# Disqus (Set to your disqus id)
disqus: